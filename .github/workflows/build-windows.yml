name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @rolldown/binding-win32-x64-msvc@1.2.14 lightningcss-win32-x64-msvc@1.32.0 lightningcss-win32-x64-msvc@1.33.0 --no-save
          if (Test-Path "node_modules/@tailwindcss/node/node_modules/lightningcss/node") {
            if (-not (Test-Path "node_modules/@tailwindcss/node/node_modules/lightningcss/node/lightningcss.win32-x64-msvc.node")) {
              if (Test-Path "node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node") {
                Copy-Item "node_modules/lightningcss-win32-x64-msvc/lightningcss.win32-x64-msvc.node" "node_modules/@tailwindcss/node/node_modules/lightningcss/node/lightningcss.win32-x64-msvc.node"
              }
            }
          }

      - name: Build Windows installer
        run: npm run electron:build -- --config.directories.output=release --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: school-grades-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
