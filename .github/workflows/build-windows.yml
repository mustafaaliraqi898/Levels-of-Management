name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run electron:build -- --config.directories.output=release

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: school-grades-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
