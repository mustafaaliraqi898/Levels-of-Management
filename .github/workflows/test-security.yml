name: Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Security Tests
        run: npm run test:security
      - name: Run Promotion Tests
        run: npm run test:promotion
      - name: Run Print Tests
        run: npm run test:print
      - name: Run Student Status Tests
        run: npm run test:status
      - name: Run Password Recovery Tests
        run: npx tsx src/tests/recovery.test.ts
      - name: Run Integration Tests
        run: npm run test:integration
      - name: Run TypeScript & ESLint Verification
        run: npm run lint
      - name: Full Test Suite
        run: npm run test:all
